* {
  box-sizing: border-box;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  min-height: 100vh;
  background-color: #DCEDC8;
  padding: 0;
  margin: 0;
}

@keyframes zh {
  0%	{font-variation-settings: 'wght' 750;transform: scaleX(1.25);}
  25%	{font-variation-settings: 'wght' 100;transform: scaleX(.65);}
  50%	{font-variation-settings: 'wght' 300;transform: scaleX(1);}
  75%	{font-variation-settings: 'wght' 550;transform: scaleX(.65);}
  100%	{font-variation-settings: 'wght' 100;transform: scaleX(1.25);}
}

@keyframes zh-before {
  0%	{transform: translate(0, .375%);}
  25%	{transform: translate(.375%, 0);}
  50%	{transform: translate(0, 0);}
  75%	{transform: translate(.375%, 0);}
  100%	{transform: translate(0, .5%);}
}
@keyframes zh-after {
  0%	{transform: translate(0, -.375%);}
  25%	{transform: translate(-.375%, 0);}
  50%	{transform: translate(0, 0);}
  75%	{transform: translate(-.375%, 0);}
  100%	{transform: translate(0, -.5%);}
}

@keyframes en {
  0%	{font-variation-settings: 'wght' 900, 'wdth' 125;}
  25%	{font-variation-settings: 'wght' 300, 'wdth' 50;}
  50%	{font-variation-settings: 'wght' 450, 'wdth' 90;}
  75%	{font-variation-settings: 'wght' 900, 'wdth' 50;}
  100%	{font-variation-settings: 'wght' 350, 'wdth' 125;}
}
		
.main{
  font-weight: 400;
  font-variation-settings: 'wght' 100, 'wdth' 85;
}
.main [lang="zh"]{
  animation: zh 20s infinite alternate both;
  font-size: 10vw;
  line-height: 10vw;
	font-family: "Source Han Sans KR VF", sans-serif;
}
.main [lang="zh"]:before,
.main [lang="zh"]:after{
	content:attr(data-content);
	position:absolute;
	left:0;
	top:0;
	width:100%;
	text-align: center;
}
.main [lang="zh"]:before{
  animation: zh-before 20s infinite alternate both;
}
.main [lang="zh"]:after{
  animation: zh-after 20s infinite alternate both;
}
.main [lang="en"]{
  animation: en 20s infinite alternate both;
  font-size: 5vw;
  line-height: 5vw;
	font-family: 'Saira', sans-serif;
}
